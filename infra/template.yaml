AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: GrantThread synthetic demonstration - private scoped data and bounded Strands worker

Parameters:
  FrontendOrigin:
    Type: String
    Description: Exact HTTPS origin only, without a trailing slash or path.
    AllowedPattern: '^https://[a-zA-Z0-9.-]+(:[0-9]+)?$'
  CallbackUrl:
    Type: String
    Description: Exact HTTPS SPA URL including deployment subfolder and trailing slash.
    AllowedPattern: '^https://[^ ]+$'
  CognitoDomainPrefix:
    Type: String
    AllowedPattern: '^[a-z0-9-]{1,63}$'
    Description: Globally available Cognito managed login domain prefix.
  BedrockModelId:
    Type: String
    Description: Verified regional foundation-model ID. No ARN, cross-region prefix, or inference profile.
    AllowedPattern: '^(?!(?:us|eu|apac|jp|au|global)\.)[a-z][a-z0-9-]*\.[a-zA-Z0-9][a-zA-Z0-9.:-]*$'
  BudgetEmail:
    Type: String
    Description: Operational recipient for monthly actual and forecast cost alerts.
    AllowedPattern: '^[^ @]+@[^ @]+\.[^ @]+$'
  MonthlyBudgetUsd:
    Type: Number
    Default: 25
    MinValue: 1
    MaxValue: 100

Globals:
  Function:
    Runtime: python3.12
    Architectures: [x86_64]
    MemorySize: 512
    Environment:
      Variables:
        GRANTTHREAD_MODE: aws
        GRANTTHREAD_TABLE: !Ref DataTable
        GRANTTHREAD_BUCKET: !Ref EvidenceBucket
        GRANTTHREAD_QUEUE_URL: !Ref AgentQueue
        BEDROCK_MODEL_ID: !Ref BedrockModelId
        GRANTTHREAD_DAILY_JOB_LIMIT: '30'
        GRANTTHREAD_ALLOWED_ORIGIN: !Ref FrontendOrigin
        PYTHONUNBUFFERED: '1'

Resources:
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub '${AWS::StackName}-users'
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: true
      UsernameAttributes: [email]
      AutoVerifiedAttributes: [email]
      Policies:
        PasswordPolicy:
          MinimumLength: 14
          RequireLowercase: true
          RequireUppercase: true
          RequireNumbers: true
          RequireSymbols: true
  ResourceServer:
    Type: AWS::Cognito::UserPoolResourceServer
    Properties:
      UserPoolId: !Ref UserPool
      Identifier: grantthread
      Name: GrantThread API
      Scopes:
        - ScopeName: access
          ScopeDescription: Authenticated GrantThread API access; membership enforced server-side
  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    DependsOn: ResourceServer
    Properties:
      UserPoolId: !Ref UserPool
      GenerateSecret: false
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows: [code]
      AllowedOAuthScopes: [openid, email, profile, grantthread/access]
      CallbackURLs: [!Ref CallbackUrl]
      LogoutURLs: [!Ref CallbackUrl]
      SupportedIdentityProviders: [COGNITO]
      PreventUserExistenceErrors: ENABLED
      EnableTokenRevocation: true
      AccessTokenValidity: 30
      IdTokenValidity: 30
      RefreshTokenValidity: 1
      TokenValidityUnits:
        AccessToken: minutes
        IdToken: minutes
        RefreshToken: days
  UserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      Domain: !Ref CognitoDomainPrefix
      UserPoolId: !Ref UserPool
  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: '$default'
      CorsConfiguration:
        AllowOrigins: [!Ref FrontendOrigin]
        AllowHeaders: [authorization, content-type]
        AllowMethods: [GET, POST, PUT, OPTIONS]
        MaxAge: 600
      DefaultRouteSettings:
        ThrottlingBurstLimit: 20
        ThrottlingRateLimit: 10
      Auth:
        DefaultAuthorizer: CognitoAccess
        Authorizers:
          CognitoAccess:
            IdentitySource: '$request.header.Authorization'
            JwtConfiguration:
              issuer: !Sub 'https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}'
              audience: [!Ref UserPoolClient]
            AuthorizationScopes: [grantthread/access]
  DataTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
  EvidenceBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      CorsConfiguration:
        CorsRules:
          - AllowedOrigins: [!Ref FrontendOrigin]
            AllowedMethods: [PUT]
            AllowedHeaders: [content-type]
            MaxAge: 600
      LifecycleConfiguration:
        Rules:
          - Id: AbortIncompleteUploads
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 1
  EvidenceBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref EvidenceBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: RequireTLS
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource:
              - !GetAtt EvidenceBucket.Arn
              - !Sub '${EvidenceBucket.Arn}/*'
            Condition:
              Bool:
                aws:SecureTransport: false
  AgentDeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      MessageRetentionPeriod: 1209600
      SqsManagedSseEnabled: true
  AgentQueue:
    Type: AWS::SQS::Queue
    Properties:
      VisibilityTimeout: 1200
      MessageRetentionPeriod: 86400
      SqsManagedSseEnabled: true
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt AgentDeadLetterQueue.Arn
        maxReceiveCount: 3
  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend
      Handler: grantthread.lambda_handler.handler
      Timeout: 28
      ReservedConcurrentExecutions: 5
      Environment:
        Variables:
          COGNITO_USER_POOL_ID: !Ref UserPool
          COGNITO_CLIENT_ID: !Ref UserPoolClient
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action: dynamodb:GetItem
              Resource: !GetAtt DataTable.Arn
              Condition:
                ForAllValues:StringLike:
                  dynamodb:LeadingKeys: ['ORG#*', 'MEMBER#*']
            - Effect: Allow
              Action: dynamodb:PutItem
              Resource: !GetAtt DataTable.Arn
              Condition:
                ForAllValues:StringLike:
                  dynamodb:LeadingKeys: ['ORG#*']
            - Effect: Allow
              Action: [s3:GetObject, s3:PutObject]
              Resource: !Sub '${EvidenceBucket.Arn}/*'
            - Effect: Allow
              Action: sqs:SendMessage
              Resource: !GetAtt AgentQueue.Arn
      Events:
        ApiRoutes:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /api/{proxy+}
            Method: ANY
        Health:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /api/health
            Method: GET
            Auth:
              Authorizer: NONE
  WorkerFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend
      Handler: grantthread.worker.handler
      Timeout: 195
      MemorySize: 768
      ReservedConcurrentExecutions: 2
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action: [dynamodb:GetItem, dynamodb:PutItem]
              Resource: !GetAtt DataTable.Arn
              Condition:
                ForAllValues:StringLike:
                  dynamodb:LeadingKeys: ['ORG#*']
            - Effect: Allow
              Action: s3:GetObject
              Resource: !Sub '${EvidenceBucket.Arn}/*'
            - Effect: Allow
              Action: [bedrock:InvokeModel, bedrock:InvokeModelWithResponseStream]
              Resource: !Sub 'arn:${AWS::Partition}:bedrock:${AWS::Region}::foundation-model/${BedrockModelId}'
      Events:
        Queue:
          Type: SQS
          Properties:
            Queue: !GetAtt AgentQueue.Arn
            BatchSize: 1
            FunctionResponseTypes: [ReportBatchItemFailures]
            ScalingConfig:
              MaximumConcurrency: 2
  ApiLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${ApiFunction}'
      RetentionInDays: 14
  WorkerLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${WorkerFunction}'
      RetentionInDays: 14
  CostBudget:
    Type: AWS::Budgets::Budget
    Properties:
      Budget:
        BudgetName: !Sub '${AWS::StackName}-monthly'
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit:
          Amount: !Ref MonthlyBudgetUsd
          Unit: USD
      NotificationsWithSubscribers:
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 80
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref BudgetEmail
        - Notification:
            NotificationType: FORECASTED
            ComparisonOperator: GREATER_THAN
            Threshold: 100
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref BudgetEmail

Outputs:
  ApiUrl:
    Value: !Sub 'https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com/api'
  CognitoClientId:
    Value: !Ref UserPoolClient
  CognitoUserPoolId:
    Value: !Ref UserPool
  CognitoDomain:
    Value: !Sub 'https://${CognitoDomainPrefix}.auth.${AWS::Region}.amazoncognito.com'
  CognitoScope:
    Value: 'openid email profile grantthread/access'
  TableName:
    Value: !Ref DataTable
  BucketName:
    Value: !Ref EvidenceBucket
  QueueUrl:
    Value: !Ref AgentQueue
  DeadLetterQueueUrl:
    Value: !Ref AgentDeadLetterQueue
  WorkerName:
    Value: !Ref WorkerFunction
